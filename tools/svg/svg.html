<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>SVG</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg 
    xmlns='http://www.w3.org/2000/svg' width='256' height='256' viewBox='0 0 24 24'%3E%3Cpath 
    fill='%236a82eb' d='M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 
    2-2m-11-4l2.03 2.71L16 11l4 5H8zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6z'%3E%3C/path%3E%3C/svg%3E">
    <style>
        * {
            box-sizing: border-box;
            font-family: Consolas, "Microsoft Yahei", sans-serif;
            margin: 0;
            padding: 0
        }

        body {
            padding: 20px;
            background: #f3f4f6;
            color: #222
        }

        h1 {
            font-size: 20px;
            margin-bottom: 12px
        }

        .btns {
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        button {
            padding: 8px 14px;
            border: 0;
            border-radius: 5px;
            background: #2563eb;
            color: #fff;
            cursor: pointer
        }

        button:hover {
            background: #1d4ed8
        }

        button.gray {
            background: #6b7280
        }

        .wrap {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            height: calc(100vh - 140px)
        }

        @media(max-width:900px) {
            .wrap {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                height: auto
            }
        }

        .col {
            display: flex;
            flex-direction: column
        }

        label {
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-family: Consolas, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            resize: none
        }

        .preview-box {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: auto
        }

        #previewImg {
            max-width: 100%;
            max-height: 100%
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <h1>SVG 源码 → Data URI</h1>

    <div class="btns">
        <button id="btnBase64">Base64</button>
        <button id="btnUtf8">URL编码</button>
        <button id="btnCopy">复制结果</button>
        <button id="btnClear" class="gray">清空</button>
    </div>

    <div class="wrap">
        <div class="col">
            <label>输入 SVG 源码</label>
            <textarea id="svgInput"></textarea>
        </div>
        <div class="col">
            <label>输出 DataURI</label>
            <textarea id="outUri" readonly></textarea>
        </div>
        <div class="col">
            <label>预览</label>
            <div class="preview-box">
                <img id="previewImg" alt="preview">
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        const svgInputEl = document.getElementById('svgInput');
        const outUriEl = document.getElementById('outUri');
        const previewImgEl = document.getElementById('previewImg');
        const toastEl = document.getElementById('toast');

        svgInputEl.addEventListener('focus', () => {
            svgInputEl.select();
        });

        outUriEl.addEventListener('focus', () => {
            outUriEl.select();
        });

        function utf8ToBase64(str) {
            const bytes = new TextEncoder().encode(str);
            let bin = '';
            for (const b of bytes) bin += String.fromCharCode(b);
            return btoa(bin);
        }

        function svgCustomEscape(raw) {
            const map = {
                '"': '\'',
                '<': '%3C',
                '>': '%3E',
                '&': '%26',
                '#': '%23',
                '%': '%25'
            };
            return raw.replace(/["<>&#%]/g, ch => map[ch]);
        }

        document.getElementById('btnBase64').onclick = () => {
            const s = svgInputEl.value;
            if (!s.trim()) { return }
            try {
                const uri = 'data:image/svg+xml;base64,' + utf8ToBase64(s);
                outUriEl.value = uri;
                previewImgEl.src = uri;
            } catch (e) {
                showToast(e.message);
            }
        };

        document.getElementById('btnUtf8').onclick = () => {
            const s = svgInputEl.value;
            if (!s.trim()) { return }
            try {
                const escaped = svgCustomEscape(s);
                const uri = 'data:image/svg+xml;charset=utf-8,' + escaped;
                outUriEl.value = uri;
                previewImgEl.src = uri;
            } catch (e) {
                showToast(e.message);
            }
        };

        document.getElementById('btnCopy').onclick = async () => {
            if (!outUriEl.value) return;
            try {
                await navigator.clipboard.writeText(outUriEl.value);
                showToast('已复制到剪切板');
            } catch (e) {
                outUriEl.select();
                document.execCommand('copy');
            }
        };

        document.getElementById('btnClear').onclick = () => {
            svgInputEl.value = '';
            outUriEl.value = '';
            previewImgEl.src = ""
        };

        let toastTimer = null;
        function showToast(msg) {
            toastEl.textContent = msg;
            clearTimeout(toastTimer);
            toastEl.classList.add('show');
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 1000);
        };
    </script>
</body>

</html>
