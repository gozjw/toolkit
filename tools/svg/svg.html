<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>SVG</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg 
    xmlns='http://www.w3.org/2000/svg' width='256' height='256' viewBox='0 0 14 14'%3E%3Cpath 
    fill='%23657eee' fill-rule='evenodd' d='m7.671 2.743l-.964.964a1 1 0 0 1-1.414-1.414l.964-.965a4.536 
    4.536 0 0 1 6.415 6.415l-.965.964a1 1 0 1 1-1.414-1.414l.964-.965a2.536 2.536 0 0 0-3.585-3.585Zm-3.964 
    2.55a1 1 0 0 1 0 1.414l-.964.965a2.536 2.536 0 0 0 3.585 3.585l.965-.964a1 1 0 0 1 1.414 
    1.414l-.964.964a4.536 4.536 0 0 1-6.415-6.414l.965-.964a1 1 0 0 1 1.414 0m5.5.914a1 1 0 0 
    0-1.414-1.414l-3 3a1 1 0 0 0 1.414 1.414z' clip-rule='evenodd'%3E%3C/path%3E%3C/svg%3E">
    <style>
        * {
            box-sizing: border-box;
            font-family: Consolas, "Microsoft Yahei", sans-serif;
            margin: 0;
            padding: 0
        }

        body {
            padding: 20px;
            background: #f3f4f6;
            color: #222
        }

        h1 {
            font-size: 20px;
            margin-bottom: 12px
        }

        .btns {
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        button {
            padding: 8px 14px;
            border: 0;
            border-radius: 5px;
            background: #2563eb;
            color: #fff;
            cursor: pointer
        }

        button:hover {
            background: #1d4ed8
        }

        button.gray {
            background: #6b7280
        }

        button.green {
            background: #059669;
        }

        button.green:hover {
            background: #047857;
        }

        button.purple {
            background: #7c3aed;
        }

        button.purple:hover {
            background: #6d28d9;
        }

        button.orange {
            background: #f97316;
        }

        button.orange:hover {
            background: #ea580c;
        }

        .wrap {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            height: calc(100vh - 140px);
        }

        @media(max-width:900px) {
            .wrap {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                height: auto
            }
        }

        .col {
            display: flex;
            flex-direction: column
        }

        label {
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-family: Consolas, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            resize: none
        }

        .preview-box {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-image: linear-gradient(45deg, #ddd 25%, transparent 25%),
                linear-gradient(-45deg, #ddd 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ddd 75%),
                linear-gradient(-45deg, transparent 75%, #ddd 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: auto
        }

        #previewImg {
            max-width: 100%;
            max-height: 100%
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <h1>SVG 源码 → DataURI / PNG / ICO</h1>

    <div class="btns">
        <button id="btnBase64">Base64</button>
        <button id="btnUtf8">URL编码</button>
        <button id="btnCopy">复制输出</button>
        <button id="btnClear" class="gray">清空</button>
        <button id="btnPng" class="green">下载PNG</button>
        <button id="btnIco" class="purple">下载ICO</button>
        <button id="btnPicker" class="orange">调用取色器</button>
    </div>

    <div class="wrap">
        <div class="col">
            <label>输入 SVG 源码</label>
            <textarea id="svgInput"></textarea>
        </div>
        <div class="col">
            <label>输出</label>
            <textarea id="outArea" readonly></textarea>
        </div>
        <div class="col">
            <label>预览</label>
            <div class="preview-box">
                <img id="previewImg" alt="preview">
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        const svgInputEl = document.getElementById('svgInput');
        const outAreaEl = document.getElementById('outArea');
        const previewImgEl = document.getElementById('previewImg');
        const toastEl = document.getElementById('toast');

        svgInputEl.addEventListener('focus', () => {
            svgInputEl.select();
        });

        outAreaEl.addEventListener('focus', () => {
            outAreaEl.select();
        });

        function utf8ToBase64(str) {
            const bytes = new TextEncoder().encode(str);
            let bin = '';
            for (const b of bytes) bin += String.fromCharCode(b);
            return btoa(bin);
        }

        function svgCustomEscape(raw) {
            const map = {
                '"': '\'',
                '<': '%3C',
                '>': '%3E',
                '&': '%26',
                '#': '%23',
                '%': '%25'
            };
            return raw.replace(/["<>&#%]/g, ch => map[ch]);
        }

        document.getElementById('btnBase64').onclick = () => {
            const s = svgInputEl.value;
            if (!s.trim()) { return }
            try {
                const uri = 'data:image/svg+xml;base64,' + utf8ToBase64(s);
                outAreaEl.value = uri;
                previewImgEl.src = uri;
            } catch (e) {
                showToast(e.message);
            }
        };

        document.getElementById('btnUtf8').onclick = () => {
            const s = svgInputEl.value;
            if (!s.trim()) { return }
            try {
                const escaped = svgCustomEscape(s);
                const uri = 'data:image/svg+xml;charset=utf-8,' + escaped;
                outAreaEl.value = uri;
                previewImgEl.src = uri;
            } catch (e) {
                showToast(e.message);
            }
        };

        document.getElementById('btnCopy').onclick = async () => {
            if (!outAreaEl.value) return;
            try {
                await navigator.clipboard.writeText(outAreaEl.value);
                showToast('已复制输出到剪切板');
            } catch (e) {
                outAreaEl.select();
                document.execCommand('copy');
            }
        };

        document.getElementById('btnPicker').onclick = async () => {
            if (!window.EyeDropper) {
                showToast("当前浏览器不支持取色器（Chrome/Edge可用）");
                return;
            }
            try {
                const eyeDropper = new EyeDropper();
                const result = await eyeDropper.open();
                const colorHex = result.sRGBHex;
                outAreaEl.value = colorHex;
                outAreaEl.focus();
                showToast("取色成功：" + colorHex);
            } catch (err) {
                if (err.name !== 'AbortError') {
                    showToast("取色失败：" + err.message);
                }
            }
        };

        async function svgToPngBlob(svgText, size = 256) {
            return new Promise((resolve, reject) => {
                const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, size, size);
                    canvas.toBlob(b => {
                        URL.revokeObjectURL(url);
                        resolve(b);
                    }, 'image/png');
                };
                img.onerror = err => {
                    URL.revokeObjectURL(url);
                    reject(err);
                };
                img.src = url;
            })
        }

        document.getElementById('btnPng').onclick = async () => {
            const svgText = svgInputEl.value.trim();
            if (!svgText) {
                showToast("请输入SVG源码");
                return;
            }
            try {
                const pngBlob = await svgToPngBlob(svgText, 256);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(pngBlob);
                a.download = 'svg-icon-256.png';
                a.click();
                URL.revokeObjectURL(a.href);
                showToast("PNG(256×256) 已下载");
            } catch (err) {
                showToast("导出失败：" + err.message);
            }
        }

        document.getElementById('btnIco').onclick = async () => {
            const svgText = svgInputEl.value.trim();
            if (!svgText) {
                showToast("请输入SVG源码");
                return;
            }
            try {
                const pngBlob = await svgToPngBlob(svgText, 256);
                const buf = await pngBlob.arrayBuffer();
                const pngBytes = new Uint8Array(buf);

                // ICO Header (6 bytes) + ICONDIRENTRY (16 bytes)
                const ico = new Uint8Array(6 + 16 + pngBytes.length);
                const view = new DataView(ico.buffer);
                view.setUint16(0, 0, true);    // reserved
                view.setUint16(2, 1, true);    // type=icon
                view.setUint16(4, 1, true);    // count=1

                // entry: width,height,colorplanes,bpp,size,offset
                view.setUint8(6, 0);    // 0 = 256
                view.setUint8(7, 0);
                view.setUint8(8, 0);
                view.setUint8(9, 32);
                view.setUint16(10, 1, true);
                view.setUint16(12, 32, true);
                view.setUint32(14, pngBytes.length, true);
                view.setUint32(18, 22, true); // offset of png data

                ico.set(pngBytes, 22);

                const icoBlob = new Blob([ico], { type: "image/x-icon" });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(icoBlob);
                a.download = 'icon.ico';
                a.click();
                URL.revokeObjectURL(a.href);
                showToast("ICO(256×256) 已下载");
            } catch (err) {
                showToast("ICO导出失败：" + err.message);
            }
        }

        document.getElementById('btnClear').onclick = () => {
            svgInputEl.value = '';
            outAreaEl.value = '';
            previewImgEl.src = ""
        };

        let toastTimer = null;
        function showToast(msg) {
            toastEl.textContent = msg;
            clearTimeout(toastTimer);
            toastEl.classList.add('show');
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 1000);
        };
    </script>
</body>

</html>
